<div class="container">
  <div class="login-text">Sign-In</div>
  <img class="png-image" src="images/cv.png" />

  <input [(ngModel)]="email" type="text" class="text-usr" placeholder="Username" />
  <input [(ngModel)]="password" type="password" class="text-pass" placeholder="Password" />

  <button typed="button" class="login-btn" (click)="onLogin()">Sign-In</button>

  <a class="create-new-account" routerLink="/regis-box">Create new account</a>
</div>

<div *ngIf="showSuccess" class="alert alert-success">Sign-In Succesfully!</div>
<div *ngIf="showError" class="alert alert-danger">{{ showError }}</div>


<style>
  * {
    box-sizing: border-box;
  }


  .alert-container {
  display: flex;
  justify-content: center;
  margin-top: 20px;
}

.alert {
  padding: 10px 20px;
  border-radius: 5px;
  text-align: center;
  min-width: 300px;
  font-size: 16px;
  font-weight: bold;
}

.alert-success {
  /* background-color: #ffe0f5; */
  color: #a87a99;
  font-weight:normal;
  /* border: 1px solid #C599B6; */
}

.alert-danger {
  /* background-color: #f8d7da; */

}


  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between; /* Ensures spacing between elements */
    width: 380px;
    height: auto; /* Adjusted height to fit all content */
    background-color: #FAD0C4;
    font-weight: bold;
    border-radius: 30px;
    border: none;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);

    /* Padding and spacing */
    padding: 15px;
    gap: 15px;

    /* Centering */
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .login-text {
  font-size: 35px;
  text-align: center;
  color: #FFF7F3;

  margin: -17px; */

}

  .png-image {

  .text-usr, .text-pass {
    width: 100%;
    height: 60px;
    padding: 20px;
    background-color: #FFF7F3; /* Set background color */
    text-align: left;
    border-radius: 20px;
    font-size: 20px;
    color: #C599B6; /* Set text color */
    font-weight: lighter;
    border: none;
  }

  .text-usr:focus, .text-pass:focus {

  }

  .login-btn {
    width: 100%;
    height: 60px;
    background-color: #C599B6;
    color: #FFF7F3;
    border: none;
    border-radius: 20px;
    font-size: 25px;
    cursor: pointer;
    transition: background-color 0.5s ease;
  }

  .login-btn:hover {
    background-color: #9e6d7a; /* Darker shade on hover */
  }

  .create-new-account {
  color: #FFF7F3;
  font-size: 17px;
  font-weight: normal;
  text-align: center;
