<div class="all-screen">
    <div class="card" *ngFor="let item of activities; let i = index">
        <button class="delete-btn" (click)="deleteActivity(i)">×</button>
        <img *ngIf="item.Image" [src]="item.Image" class="card-img">
        <h3>{{ item.Name }}</h3>
        <p><strong>Place :</strong> {{ item.Place }}</p>
        <p><strong>Date :</strong> {{ item.Date | date:'yyyy-MM-dd' }}</p>
        <p><strong>Comment :</strong> {{ item.Comment }}</p>

        <p [class.collapsed]="!expandedCards[i]">Detail : {{ item.Detail }}</p>

        
        <button class="toggle-btn" (click)="expandedCards[i] = !expandedCards[i]">
            {{ expandedCards[i] ? 'See Less' : 'See More' }}
        </button>
        <button class="edit-btn" (click)="editActivity(i)"> + Edit </button>
    </div>
    <button class="adding-box" (click)="clearForm()">+</button>
</div>

<!-- Pop-up Overlay -->
<div class="overlay" [class.active]="isPopupOpen" (click)="closePopup()"></div>

<!-- Academic Box (Popup) -->
<div class="outer-box" [class.active]="isPopupOpen" [class.closing]="isClosing">
    <div class="activity-box">
        <div *ngIf="showError" class="error-text">Please fill in all fields correctly.</div>
        <button class="close-btn" (click)="closePopup()">✖</button>

        <div class="activity-text">Activity</div>

        <div class="form-row">
            <input [(ngModel)]="name" type="text" class="input-field" placeholder="Name of activity">
            <input [(ngModel)]="date" type="date" class="input-field" placeholder="Date">
        </div>

        <div class="form-row">
            <input [(ngModel)]="place" type="text" class="input-field" placeholder="Place">
            <input [(ngModel)]="comment" type="text" class="input-field" placeholder="Comment">
        </div>

        <div class="form-row">
            <div class="upload-box">
                <label for="fileInput" class="upload-label">Upload pic +</label>
                <input type="file" id="fileInput" (change)="onImageSelected($event)" accept="image/*">
                <img *ngIf="previewImage" [src]="previewImage" class="preview-img" alt="Uploaded Image">
            </div>
            <textarea [(ngModel)]="detail" class="detail-box" placeholder="Detail"></textarea>
        </div>

        <button (click)="saveActivity()" class="save-btn">{{ editAcademicId !== null ? 'Update' : 'Add' }}</button>
    </div>
</div>



<style>
    .all-screen {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        margin: 20px;
        flex-wrap: wrap;

    }

    /* Initially hidden */
    /* Initially hidden */
    .outer-box {
        padding: 10px;
        width: 720px;
        height: 510px;
        background-color: #E6B2BA;
        border-radius: 30px;
        position: fixed;
        bottom: -100%;
        /* Start hidden below */
        left: 50%;
        transform: translate(-50%, 0);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        opacity: 0;
        visibility: hidden;
        transition: bottom 0.4s ease-in-out, opacity 0.4s ease-in-out;
    }

    /* Slide up (Show) */
    .outer-box.active {
        bottom: 20%;
        /* Move up */
        opacity: 1;
        visibility: visible;
    }

    /* Slide down (Hide) */
    .outer-box.closing {
        bottom: -100%;
        /* Move back down */
        opacity: 0;
        visibility: hidden;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease-in-out;
    }

    /* Show overlay when active */
    .overlay.active {
        opacity: 1;
        visibility: visible;
    }


    .activity-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 650px;
        height: 440px;
        background-color: #E6B2BA;
        border-radius: 20px;
        padding: 20px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        gap: 10px;
        border: 5px solid #FFF7F3;

    }

    .activity-text {
        width: 100%;
        text-align: left;
        color: #FFF7F3;
        font-size: 40px;
        font-weight: bold;
        margin-left: 20px;
    }

    .form-row {
        display: flex;
        justify-content: space-between;
        width: 100%;
        gap: 10px;
    }

    .input-field {
        width: 48%;
        height: 40px;
        background-color: #FFF7F3;
        color: #726c70;
        border: none;
        border-radius: 15px;
        padding: 10px;
        font-size: 16px;
    }

    .upload-box {
        width: 49%;
        height: 122px;
        background-color: #FFF7F3;
        color: #E6B2BA;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        align-items: start;
        justify-content: start;
        font-size: 16px;
        font-weight: normal;
        position: relative;
        overflow: hidden;
        padding: 10px;
    }

    /* Hide the default file input */
    #fileInput {
        display: none;
    }

    /* Upload Label */
    .upload-label {
        display: grid;
        cursor: pointer;
        background-color: #E6B2BA;
        color: #FFF7F3;
        padding: 10px;
        border-radius: 10px;
        font-size: 14px;
        text-align: start;
        justify-content: start;
    }

    /* Preview Image */
    .preview-img {
        width: auto;
        /* Adjust width */
        height: auto;
        /* Maintain aspect ratio */
        max-height: 100px;
        /* Prevent from getting too big */
        border-radius: 10px;
        margin-top: 10px;
        object-fit: cover;
    }

    .plus-sign {
        font-size: 40px;
        font-weight: bold;
    }

    .detail-box {
        width: 46%;
        height: 120px;
        background-color: #FFF7F3;
        color: #726c70;
        border: none;
        border-radius: 15px;
        padding: 10px;
        font-size: 16px;
        resize: none;
    }

    .save-btn {
        align-self: flex-end;
        width: 100px;
        height: 40px;
        background-color: #FFF7F3;
        color: #E6B2BA;
        border: none;
        border-radius: 15px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 20px;
    }

    .save-btn:hover {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .detail-box,
    .input-field {
        border: 2px solid #E6B2BA;
        outline: none;
    }

    .close-btn {
        position: absolute;
        top: 10px;
        right: 15px;
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: white;
    }

    .adding-box {
        display: grid;
        background-color: #E6B2BA;
        width: 185px;
        height: 235px;
        text-align: center;
        border-radius: 30px;
        align-items: center;
        justify-content: center;
        font-size: 75px;
        font-weight: normal;
        color: aliceblue;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-decoration: none;
        border: none;
        opacity: 65%;

    }

    .adding-box:hover {
        transform: scale(1.02);
    }

    .error-text {
        color: rgb(255, 0, 0);
        font-size: 14px;
        margin-bottom: 10px;
    }

    .card-container {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
    }

    .card {
        position: relative;
        background: #fff;
        border-radius: 20px;
        padding: 16px;
        width: 250px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: normal;
    }


    .delete-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        /* change to left: 8px; if you want it on the top-left */
        background: #E6B2BA;
        border: none;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        line-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .delete-btn:hover {
        background: #e60000;
    }

    .collapsed {
        display: -webkit-box;
        -webkit-line-clamp: 1;
        /* show only 3 lines */
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .toggle-btn {
        background: #E6B2BA;
        border: none;
        color: white;
        cursor: pointer;
        padding: 0;
        font-size: 14px;
        padding: 5px;
        border-radius: 5px;
    }

    .card-img {
        width: 100%;
        max-height: 150px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 10px;
    }

    .edit-btn{
        margin: 10px;
        background: #E6B2BA;
        border: none;
        color: white;
        cursor: pointer;
        padding: 0;
        font-size: 14px;
        padding: 5px;
        border-radius: 5px;
    }
</style>
